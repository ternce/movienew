worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;

    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/woff2;

    # Client body size
    client_max_body_size 500M;

    # Proxy buffering
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 4 64k;
    proxy_busy_buffers_size 128k;

    # Proxy timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Upstreams
    upstream web_upstream {
        server web:3000;
    }

    upstream api_upstream {
        server api:4000;
    }

    upstream minio_upstream {
        server minio:9000;
    }

    upstream mailpit_upstream {
        server mailpit:8025;
    }

    # ---------------------------------------------------------
    # HTTP -> HTTPS
    # ---------------------------------------------------------
    server {
        listen 80;
        server_name sesh-tv.com;

        return 301 https://sesh-tv.com$request_uri;
    }

    # ---------------------------------------------------------
    # HTTPS
    # ---------------------------------------------------------
    server {
        listen 443 ssl;
        server_name sesh-tv.com;

        # SSL certificate
        ssl_certificate /etc/nginx/ssl/fullchain.crt;
        ssl_certificate_key /etc/nginx/ssl/certificate.key;

        # TLS
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # -----------------------------------------------------
        # API
        # -----------------------------------------------------
        location /api {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # -----------------------------------------------------
        # Socket.IO / Watch Party / Notifications
        # -----------------------------------------------------
        location /socket.io {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        # -----------------------------------------------------
        # Next.js static assets
        # -----------------------------------------------------
        location /_next/static {
            proxy_pass http://web_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;

            expires 1y;
            add_header Cache-Control "public, immutable";

            access_log off;
        }

        # -----------------------------------------------------
        # Next.js image optimization
        # -----------------------------------------------------
        location /_next/image {
            proxy_pass http://web_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            expires 1h;
            add_header Cache-Control "public";
        }

        # -----------------------------------------------------
        # Public images
        # -----------------------------------------------------
        location /images/ {
            proxy_pass http://web_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;

            expires 7d;
            add_header Cache-Control "public";

            access_log off;
        }

        # -----------------------------------------------------
        # Fonts
        # -----------------------------------------------------
        location /fonts/ {
            proxy_pass http://web_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;

            expires 1y;
            add_header Cache-Control "public, immutable";

            access_log off;
        }

        # -----------------------------------------------------
        # Favicon
        # -----------------------------------------------------
        location = /favicon.ico {
            proxy_pass http://web_upstream;

            expires 7d;
            access_log off;
        }

        # -----------------------------------------------------
        # PWA manifest
        # -----------------------------------------------------
        location = /site.webmanifest {
            proxy_pass http://web_upstream;

            add_header Cache-Control "no-cache";
        }

        # -----------------------------------------------------
        # PWA icons
        # -----------------------------------------------------
        location ~* ^/(icon-192x192\.png|icon-512x512\.png|icon-maskable-512x512\.png|apple-touch-icon\.png)$ {
            proxy_pass http://web_upstream;

            expires 7d;
            add_header Cache-Control "public";
        }

        # -----------------------------------------------------
        # MinIO
        # -----------------------------------------------------
        location /minio/ {
            proxy_pass http://minio_upstream/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # Range requests for video streaming
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;

            # Streaming should not be buffered
            proxy_buffering off;

            expires 7d;
            add_header Cache-Control "public";
        }

        # -----------------------------------------------------
        # Mailpit
        # -----------------------------------------------------
        location /mailpit/ {
            proxy_pass http://mailpit_upstream/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # -----------------------------------------------------
        # Uploaded files
        # -----------------------------------------------------
        location /uploads/ {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            expires 7d;
            add_header Cache-Control "public";

            access_log off;
        }

        # -----------------------------------------------------
        # Health check
        # -----------------------------------------------------
        location /nginx-health {
            access_log off;

            add_header Content-Type text/plain;

            return 200 "ok";
        }

        # -----------------------------------------------------
        # Next.js
        # -----------------------------------------------------
        location / {
            proxy_pass http://web_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}